name: run gen code on matlab runner on dispatch from simulink repo
on:
  workflow_dispatch:
  repository_dispatch:
  push:

env:
  MLM_LICENSE_TOKEN: ${{ secrets.MLM_LICENSE_TOKEN }}

jobs:
  create-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout drivebrain_simulink_models
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Checkout simulink_automation
        uses: actions/checkout@v4
        with:
          repository: hytech-racing/simulink_automation
          token: ${{ secrets.GITHUB_TOKEN }}
          path: simulink_automation

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2.5
        with:
          release: R2024bU5
          cache: true
          products: |
            Simulink
            Signal_Processing_Toolbox
            Simulink_Coder
            Embedded_Coder
            Phased_Array_System_Toolbox
            Control_System_Toolbox
            Optimization_Toolbox

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Mako
        run: pip install mako

      - name: Clean
        working-directory: simulink_automation
        run: ./clean.sh

      - name: Run MATLAB
        uses: matlab-actions/run-command@v2
        with:
          command: |
            repo = getenv('GITHUB_WORKSPACE');
            sim = fullfile(repo, 'simulink_automation');
            addpath(genpath(repo));
            addpath(genpath(sim));
            cd(sim);
            gencode_v2;

      - name: Generate cpp lib
        working-directory: simulink_automation
        run: |
          mkdir -p gen_release
          python process_simulink_codegen.py gen_release

      - name: Create artifact
        working-directory: simulink_automation
        run: tar -czvf release.tar.gz gen_release

      - name: Generate release tag
        id: tag
        run: echo "release_tag=CodeGen_$(date +"%Y.%m.%d_%H-%M")" >> $GITHUB_OUTPUT

      - name: Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          files: simulink_automation/release.tar.gz


